# Fail closed unless a disposable PostgreSQL database is explicitly supplied.
spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://127.0.0.1:1/moviemux_test}
spring.datasource.username=${TEST_DATABASE_USER:moviemux_test}
spring.datasource.password=${TEST_DATABASE_PASSWORD:moviemux_test}
spring.datasource.hikari.connection-timeout=1000
spring.jpa.hibernate.ddl-auto=validate
scheduling.enabled=false
send.mail=false
kit.key=synthetic-test-key
kit.url=http://127.0.0.1:1
discord.webhook.url=http://127.0.0.1:1
discord.webhook.execute=false
discord.webhook.update=false
discord.webhook.role.id=synthetic-test-role
socket.io.api.url=http://127.0.0.1:1
socket.io.api.key=synthetic-test-key
jwt.secret=synthetic-test-secret-at-least-32-bytes-long
jwt.expiration=3600000

context.initializer.classes=com.moviemux.support.LocalTestDatabaseInitializer
